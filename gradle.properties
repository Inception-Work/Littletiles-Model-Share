# ---- Gradle 自身 ----
# Gradle 4.10.3 只认 Java 8~11，所以 daemon 必须跑 JDK 8。
# 这里不写死路径（原值 C:/Users/gaksy/.jdks/temurin-8 只在那台机器有效，换平台就会启动失败）：
#   方式一：运行前设置 JAVA_HOME 指向 JDK 8；
#   方式二：在用户级 ~/.gradle/gradle.properties（不进仓库）里写
#           org.gradle.java.home=/path/to/jdk8
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.console=plain

# ---- 代理（本机 Clash 7890；不用时整段注释）----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]

# ---- 模组 ----
modVersion=0.1.2