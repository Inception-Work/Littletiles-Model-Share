plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'work.inception'

base {
    archivesName = 'LittletilesModelShare'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.4'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file(project.findProperty('ltsReviewRun') ?: 'run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            // Remap production mod refmaps (LittleTiles/CreativeCore ship SRG refmaps).
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // More headroom for remote cover textures, OBJ models and blueprint parsing.
            jvmArgs '-Xms1G', '-Xmx6G', '-XX:+UseG1GC'
            if (project.hasProperty('ltsDebugOpen')) {
                jvmArgs '-Dltsmodelshare.debugOpen=true'
            }
            mods {
                ltsmodelshare {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file(project.findProperty('ltsReviewRun') ?: 'run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-Xms512M', '-Xmx3G', '-XX:+UseG1GC'
            args '--nogui'
            mods {
                ltsmodelshare {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    flatDir {
        dirs 'deps'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.4-45.4.0'
    // Local LittleTiles / CreativeCore 1.19.4 jars (flatDir names); deobf so compilation sees official names.
    compileOnly fg.deobf('local:littletiles:1.19.4')
    compileOnly fg.deobf('local:creativecore:1.19.4')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'ltsmodelshare',
                'Specification-Vendor'    : 'inception',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'inception'
        ])
    }
}



// V2 protocol fixtures, real loopback HTTP and optional public read-only checks.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
tasks.register("v2Checks", JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "work.inception.ltsmodelshare.api.V2Checks"
    if (project.hasProperty("publicV2Read")) args "public"
}

// The release channel belongs to the build: stable checks stable, test checks test.
processResources {
    def updateChannel = project.findProperty('modChannel') ?: 'test'
    if (!(updateChannel in ['test', 'stable'])) throw new GradleException('modChannel must be test or stable')
    inputs.property 'updateChannel', updateChannel
    inputs.property 'updateVersion', project.version
    filesMatching('lts-update.properties') {
        expand version: project.version, updateChannel: updateChannel
    }
}

task updateChannelChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'work.inception.ltsmodelshare.api.UpdateCheckTest'
}
check.dependsOn updateChannelChecks

task modernGridChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    main = 'work.inception.ltsmodelshare.server.ModernGridChecks'
}
check.dependsOn modernGridChecks

task gridQueryChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    main = 'work.inception.ltsmodelshare.api.GridQueryChecks'
}
check.dependsOn gridQueryChecks

task collectionGridChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    main = 'work.inception.ltsmodelshare.gui.CollectionGridChecks'
}
check.dependsOn collectionGridChecks
