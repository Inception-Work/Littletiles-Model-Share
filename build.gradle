plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.7'
group = 'work.inception'

base {
    archivesName = 'LittletilesModelShare'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge 21.1.x -> Minecraft 1.21.1, official (Mojang) mappings via NeoForm.
    version = '21.1.133'

    runs {
        client {
            client()
            // More headroom for remote cover textures, OBJ models and blueprint parsing.
            jvmArguments.addAll(['-Xms1G', '-Xmx6G', '-XX:+UseG1GC'])
        }
        server {
            server()
            jvmArguments.addAll(['-Xms512M', '-Xmx3G', '-XX:+UseG1GC'])
            programArguments.add('--nogui')
        }
    }

    mods {
        ltsmodelshare {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // LittleTiles / CreativeCore 1.21.1 NeoForge builds are compiled against Mojang mappings,
    // so they can be consumed directly (no fg.deobf equivalent needed on NeoForge 1.21).
    compileOnly files('deps/littletiles-1.21.1.jar', 'deps/creativecore-1.21.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'ltsmodelshare',
                'Specification-Vendor'    : 'inception',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'inception'
        ])
    }
}

// Test release layout: build/releases/0.1.6-neoforge1.21.1-test/LittletilesModelShare-0.1.6-neoforge1.21.1.jar
tasks.register('neoForge1211Release', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('releases/0.1.6-neoforge1.21.1-test')
    rename { 'LittletilesModelShare-0.1.6-neoforge1.21.1.jar' }
}

tasks.named('build') {
    dependsOn 'neoForge1211Release'
}
