/**
 * ä¿®ã€Œ1.12.2 å®¢æˆ·ç«¯åˆ·ä¸€å † HTTP 400ã€ã€‚
 *
 * èƒŒæ™¯ï¼šForgeGradle çš„ makeStart ä¼šæŠŠ GradleStart çš„é»˜è®¤ assetsDir å†™æˆ
 * <gradle home>/caches/minecraft/assetsï¼Œä½†èµ„æºå…¶å®žä¸‹åœ¨ caches/forge_gradle/assetsï¼Œ
 * äºŽæ˜¯å®¢æˆ·ç«¯ä»¥ä¸º 1305 ä¸ªèµ„æºå…¨ç¼º â†’ åŽ» http://resources.download.minecraft.net æ‹‰
 * â†’ Mojang çš„ CDN çŽ°åœ¨å¯¹ http ç›´æŽ¥å›ž 400ï¼ˆhttps æ‰æ­£å¸¸ï¼‰â†’ å‡ åƒæ¡ 400ï¼Œè¿›æ¸¸æˆè¿˜æ…¢ã€‚
 *
 * åšæ³•ï¼šåœ¨ Windows ä¸Šç»™ä¸¤ä¸ªç›®å½•å»º junctionï¼ˆç›®å½•è½¯é“¾ï¼‰ï¼Œè®©å®¢æˆ·ç«¯é‚£æ¡é»˜è®¤è·¯å¾„èƒ½çœ‹åˆ°èµ„æºã€‚
 * éž Windows ç›´æŽ¥æç¤ºæ‰‹åŠ¨å¤„ç†ï¼ˆLinux/macOS ç”¨ ln -sï¼‰ã€‚
 */
task fixAssetsDir {
    group = 'ltsmodelshare'
    description = 'æŠŠ forge_gradle çš„èµ„æºç›®å½•é“¾åˆ° GradleStart é»˜è®¤æ‰¾çš„ä½ç½®ï¼ˆä¿® 1.12.2 èµ„æº 400 åˆ·å±ï¼‰'
    doLast {
        def real = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/assets')
        def link = new File(gradle.gradleUserHomeDir, 'caches/minecraft/assets')
        if (!real.isDirectory()) {
            println "[fixAssetsDir] è·³è¿‡ï¼š$real ä¸å­˜åœ¨ï¼ˆå…ˆè·‘ä¸€æ¬¡ getAssetsï¼‰"
            return
        }
        if (new File(link, 'indexes/1.12.json').isFile()) {
            println "[fixAssetsDir] å·²ç»æŒ‡å¥½äº†ï¼š$link"
            return
        }
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            println "[fixAssetsDir] éž Windowsï¼šè¯·æ‰‹åŠ¨ ln -s \"$real\" \"$link\""
            return
        }
        if (link.exists()) {
            // åŠæˆå“/ç©ºå£³ç›®å½•ï¼šç”¨ rmdir åˆ ï¼ˆé¿å…è¯¯è·Ÿç¬¦å·é“¾æŽ¥æŠŠçœŸå®žèµ„æºåˆ æŽ‰ï¼‰
            "cmd /c rmdir /s /q \"${link.absolutePath}\"".execute().waitFor()
        }
        link.parentFile.mkdirs()
        def proc = "cmd /c mklink /J \"${link.absolutePath}\" \"${real.absolutePath}\"".execute()
        proc.waitFor()
        println "[fixAssetsDir] å·²å»ºç«‹é“¾æŽ¥ï¼š$link -> $real"
    }
}

