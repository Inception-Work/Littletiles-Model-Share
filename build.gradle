plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'work.inception'

base {
    archivesName = 'LittletilesModelShare'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge 21.1.x -> Minecraft 1.21.1, official (Mojang) mappings via NeoForm.
    version = '21.1.133'

    runs {
        client {
            client()
            // More headroom for remote cover textures, OBJ models and blueprint parsing.
            jvmArguments.addAll(['-Xms1G', '-Xmx6G', '-XX:+UseG1GC'])
        }
        server {
            server()
            jvmArguments.addAll(['-Xms512M', '-Xmx3G', '-XX:+UseG1GC'])
            programArguments.add('--nogui')
        }
    }

    mods {
        ltsmodelshare {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // LittleTiles / CreativeCore 1.21.1 NeoForge builds are compiled against Mojang mappings,
    // so they can be consumed directly (no fg.deobf equivalent needed on NeoForge 1.21).
    compileOnly files('deps/littletiles-1.21.1.jar', 'deps/creativecore-1.21.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'ltsmodelshare',
                'Specification-Vendor'    : 'inception',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'inception'
        ])
    }
}

// Release layout: build/releases/1.0.0-neoforge1.21.1/LittletilesModelShare-1.0.0-neoforge1.21.1.jar
tasks.register('neoForge1211Release', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('releases/1.0.0-neoforge1.21.1')
    rename { 'LittletilesModelShare-1.0.0-neoforge1.21.1.jar' }
}

tasks.named('build') {
    dependsOn 'neoForge1211Release'
}

// Protocol regression checks; no game or player configuration.
tasks.register("neoV2Checks", JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = "work.inception.ltsmodelshare.api.NeoV2Checks"
 if (project.hasProperty("publicV2Read")) args "public"
}

// NeoForge exposes game libraries to main; include those same libraries for protocol tests.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

// The release channel belongs to the build: stable checks stable, test checks test.
processResources {
    def updateChannel = project.findProperty('modChannel') ?: 'test'
    if (!(updateChannel in ['test', 'stable'])) throw new GradleException('modChannel must be test or stable')
    inputs.property 'updateChannel', updateChannel
    inputs.property 'updateVersion', project.version
    filesMatching('lts-update.properties') {
        expand version: project.version, updateChannel: updateChannel
    }
}

task updateChannelChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'work.inception.ltsmodelshare.api.UpdateCheckTest'
}
check.dependsOn updateChannelChecks

task modernGridChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    main = 'work.inception.ltsmodelshare.server.ModernGridChecks'
}
check.dependsOn modernGridChecks

task gridQueryChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    main = 'work.inception.ltsmodelshare.api.GridQueryChecks'
}
check.dependsOn gridQueryChecks

task collectionGridChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    main = 'work.inception.ltsmodelshare.gui.CollectionGridChecks'
}
check.dependsOn collectionGridChecks
