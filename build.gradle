 *
 * Ã¥ÂÅ¡Ã¦Â³â€¢Ã¯Â¼Å¡Ã¥Å“Â¨ Windows Ã¤Â¸Å Ã§Â»â„¢Ã¤Â¸Â¤Ã¤Â¸ÂªÃ§â€ºÂ®Ã¥Â½â€¢Ã¥Â»Âº junctionÃ¯Â¼Ë†Ã§â€ºÂ®Ã¥Â½â€¢Ã¨Â½Â¯Ã©â€œÂ¾Ã¯Â¼â€°Ã¯Â¼Å’Ã¨Â®Â©Ã¥Â®Â¢Ã¦Ë†Â·Ã§Â«Â¯Ã©â€šÂ£Ã¦ÂÂ¡Ã©Â»ËœÃ¨Â®Â¤Ã¨Â·Â¯Ã¥Â¾â€žÃ¨Æ’Â½Ã§Å“â€¹Ã¥Ë†Â°Ã¨Âµâ€žÃ¦ÂºÂÃ£â‚¬â€š
 * Ã©ÂÅ¾ Windows Ã§â€ºÂ´Ã¦Å½Â¥Ã¦ÂÂÃ§Â¤ÂºÃ¦â€°â€¹Ã¥Å Â¨Ã¥Â¤â€žÃ§Ââ€ Ã¯Â¼Ë†Linux/macOS Ã§â€Â¨ ln -sÃ¯Â¼â€°Ã£â‚¬â€š
 */
task fixAssetsDir {
    group = 'ltsmodelshare'
    description = 'Ã¦Å Å  forge_gradle Ã§Å¡â€žÃ¨Âµâ€žÃ¦ÂºÂÃ§â€ºÂ®Ã¥Â½â€¢Ã©â€œÂ¾Ã¥Ë†Â° GradleStart Ã©Â»ËœÃ¨Â®Â¤Ã¦â€°Â¾Ã§Å¡â€žÃ¤Â½ÂÃ§Â½Â®Ã¯Â¼Ë†Ã¤Â¿Â® 1.12.2 Ã¨Âµâ€žÃ¦ÂºÂ 400 Ã¥Ë†Â·Ã¥Â±ÂÃ¯Â¼â€°'
    doLast {
        def real = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/assets')
        def link = new File(gradle.gradleUserHomeDir, 'caches/minecraft/assets')
        if (!real.isDirectory()) {
            println "[fixAssetsDir] Ã¨Â·Â³Ã¨Â¿â€¡Ã¯Â¼Å¡$real Ã¤Â¸ÂÃ¥Â­ËœÃ¥Å“Â¨Ã¯Â¼Ë†Ã¥â€¦Ë†Ã¨Â·â€˜Ã¤Â¸â‚¬Ã¦Â¬Â¡ getAssetsÃ¯Â¼â€°"
            return
        }
        if (new File(link, 'indexes/1.12.json').isFile()) {
            println "[fixAssetsDir] Ã¥Â·Â²Ã§Â»ÂÃ¦Å’â€¡Ã¥Â¥Â½Ã¤Âºâ€ Ã¯Â¼Å¡$link"
            return
        }
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            println "[fixAssetsDir] Ã©ÂÅ¾ WindowsÃ¯Â¼Å¡Ã¨Â¯Â·Ã¦â€°â€¹Ã¥Å Â¨ ln -s \"$real\" \"$link\""
            return
        }
        if (link.exists()) {
            // Ã¥ÂÅ Ã¦Ë†ÂÃ¥â€œÂ/Ã§Â©ÂºÃ¥Â£Â³Ã§â€ºÂ®Ã¥Â½â€¢Ã¯Â¼Å¡Ã§â€Â¨ rmdir Ã¥Ë†Â Ã¯Â¼Ë†Ã©ÂÂ¿Ã¥â€¦ÂÃ¨Â¯Â¯Ã¨Â·Å¸Ã§Â¬Â¦Ã¥ÂÂ·Ã©â€œÂ¾Ã¦Å½Â¥Ã¦Å Å Ã§Å“Å¸Ã¥Â®Å¾Ã¨Âµâ€žÃ¦ÂºÂÃ¥Ë†Â Ã¦Å½â€°Ã¯Â¼â€°
            "cmd /c rmdir /s /q \"${link.absolutePath}\"".execute().waitFor()
        }
        link.parentFile.mkdirs()
        def proc = "cmd /c mklink /J \"${link.absolutePath}\" \"${real.absolutePath}\"".execute()
        proc.waitFor()
        println "[fixAssetsDir] Ã¥Â·Â²Ã¥Â»ÂºÃ§Â«â€¹Ã©â€œÂ¾Ã¦Å½Â¥Ã¯Â¼Å¡$link -> $real"
    }
}

// Ã¨Â·â€˜Ã¥Â®Â¢Ã¦Ë†Â·Ã§Â«Â¯Ã¥â€°ÂÃ¨â€¡ÂªÃ¥Å Â¨Ã¤Â¿ÂÃ¨Â¯ÂÃ¨Âµâ€žÃ¦ÂºÂÃ§â€ºÂ®Ã¥Â½â€¢Ã¥ÂÂ¯Ã§â€Â¨
