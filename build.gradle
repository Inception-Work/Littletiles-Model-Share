plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.5'
group = 'work.inception'

base {
    archivesName = 'LittletilesModelShare'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            // Remap production mod refmaps (LittleTiles/CreativeCore ship SRG refmaps).
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // More headroom for remote cover textures, OBJ models and blueprint parsing.
            jvmArgs '-Xms1G', '-Xmx6G', '-XX:+UseG1GC'
            if (project.hasProperty('ltsDebugOpen')) {
                jvmArgs '-Dltsmodelshare.debugOpen=true'
            }
            mods {
                ltsmodelshare {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-Xms512M', '-Xmx3G', '-XX:+UseG1GC'
            args '--nogui'
            mods {
                ltsmodelshare {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    flatDir {
        dirs 'deps'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    // Local LittleTiles / CreativeCore 1.20.1 jars (flatDir names); deobf so compilation sees official names.
    compileOnly fg.deobf('local:littletiles:1.20.1')
    compileOnly fg.deobf('local:creativecore:1.20.1')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'ltsmodelshare',
                'Specification-Vendor'    : 'inception',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'inception'
        ])
    }
}

