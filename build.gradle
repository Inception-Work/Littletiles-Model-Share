// Exercise localization behavior without starting the game or adding test libraries.
task localizationChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'work.inception.ltsmodelshare.client.LocalizationChecks'
}
check.dependsOn localizationChecks

// Exercise bounded OBJ parsing without opening a Minecraft window or OpenGL context.
task objModelChecks(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'work.inception.ltsmodelshare.gui.ObjModelChecks'
}
